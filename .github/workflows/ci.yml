name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mongodb-memory-server: pinned MongoDB version (8.2.x has no ubuntu24.04 build), cached across runs.
  MONGOMS_VERSION: 8.0.32
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v5
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit + integration tests (server integration runs against an in-memory MongoDB replica set).
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid

  e2e:
    name: Two-browser end-to-end
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v5
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: npm ci
      - run: npm run build:shared && npm run build -w @rivalrush/server
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
