# Render Blueprint for the RivalRush game server — FREE plan.
#
# Free web services sleep after ~15 min without inbound requests and take up to ~1 min to
# wake. Live games are in memory, so a sleep or restart ends games in progress. Keep it
# awake with a free uptime pinger on /health (see docs/deployment.md); one always-awake
# service fits in the monthly free instance hours.
services:
  - type: web
    name: rivalrush-api
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1 # MUST stay 1 until a Redis RoomStore + Socket.IO adapter exist
    autoDeploy: false # set "Auto-Deploy: After CI Checks Pass" in the dashboard
    # --include=dev: NODE_ENV=production makes npm skip devDependencies, but the build needs
    # TypeScript and the @types packages.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w @rivalrush/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
      # Webhook mode: Telegram's request wakes a sleeping free instance. The webhook URL is
      # built from RENDER_EXTERNAL_URL, which Render sets automatically.
      - key: BOT_MODE
        value: webhook
      - key: DEV_LOGIN_ENABLED
        value: 'false'
      - key: DISCONNECT_GRACE_SECONDS
        value: '60'
      - key: ROOM_TTL_MINUTES
        value: '120'
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard (never commit them):
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
